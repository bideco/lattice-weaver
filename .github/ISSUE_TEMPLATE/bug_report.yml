name: Bug report
description: Something is broken or behaves unexpectedly in the mod or companion.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please confirm:
        - You have the matching mod JAR for your Minecraft version (see the [Releases page](https://github.com/bideco/lattice-weaver/releases/latest))
        - Fabric API is installed in the same instance
        - The companion is running before you launch the game

        **For licensing / purchase / refund questions**, email support@bide.cx instead — that gets a faster response than a public issue.
  - type: input
    id: mc-version
    attributes:
      label: Minecraft version
      description: e.g. 1.21.8, 26.1.2
      placeholder: "1.21.8"
    validations:
      required: true
  - type: input
    id: mod-jar
    attributes:
      label: Lattice mod JAR filename
      description: The exact filename in your `mods/` folder (e.g. `latticework-1.0.0+1.21.8.jar`)
      placeholder: "latticework-1.0.0+1.21.8.jar"
    validations:
      required: true
  - type: input
    id: companion-version
    attributes:
      label: Companion version
      description: First line of the companion's TUI or the output of `lattice-weaver.exe --help`
      placeholder: "Lattice Weaver v1.0.0"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Input backend
      options:
        - Interception (default)
        - Raw Input + LL hooks (--force-fallback)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to make it happen.
      placeholder: |
        1. Launch companion
        2. Launch two MC instances with -Dlattice.player=0 and -Dlattice.player=1
        3. Press End
        4. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        - Mod side: `.minecraft/logs/latest.log`
        - Companion side: `%ProgramData%\Lattice\lattice-debug.log` (run with `--debug` to populate)
        Paste the relevant section, or attach the file.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Latest mod JAR from the Releases page
          required: true
        - label: Fabric API installed in the same instance
          required: true
